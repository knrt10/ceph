tasks:
- install:
    extra_packages:
      deb:
        - ceph-osd-crimson
        - ceph-osd-crimson-dbg
      rpm:
        - ceph-osd-crimson
        - ceph-osd-crimson-debuginfo
- pexec:
    all:
      - sudo update-alternatives --set ceph-osd /usr/bin/ceph-osd-crimson
- pexec:
    all:
      - sudo dnf -y install 'c-ares >= 1.28.0'
      - rpm -q c-ares
